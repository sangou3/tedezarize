	<meta charset="utf-8" />

	<script src="http://titiburomenkamera.saitama.jp/js/jquery.rwdImageMaps.min.js"></script>
	<style>
		img[usemap] {
			border: none;
			height: auto;
			max-width: 100%;
			width: auto;
		}
		.wrapper {
			overflow: hidden;
			min-width: 900px;
			max-width: 1440px;
		}
		.main {
			float: left;
			width: 100%;
			margin-right: -400px;
			padding-right: 400px;
			box-sizing: border-box;
			position: relative;
		}
		.side {
			float: left;
			width: 400px;
		}
		.marker {
			position: absolute;
			width: 20px;
			height: 20px;
			background-color: rgba(255, 0, 0, 0.5);
			border-radius: 50%;
			pointer-events: none;
			display: none;
		}
		.camera-list {
			margin-top: 20px;
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
		}
		.camera-item {
			width: 150px;
			text-align: center;
			border: 1px solid #ccc;
			padding: 10px;
			box-sizing: border-box;
		}
		.camera-item img {
			width: 100%;
			height: auto;
		}
		.area_style {
			position: absolute;
			width: 20px;
			height: 20px;
			background-color: red; /* 常に赤色で表示 */
			border-radius: 50%;
			transform: translate(-50%, -50%);
			transition: background-color 0.2s ease; /* 色変化のスムーズさを追加 */
		}
		.area_style:hover {
			background-color: blue; /* マウスオーバー時の色変更 */
		}
		.marker {
			position: absolute;
			width: 20px;
			height: 20px;
			background-color: red; /* 初期状態で赤色 */
			border-radius: 50%;
			transform: translate(-50%, -50%);
			transition: background-color 0.2s ease; /* スムーズな色変化 */
		}
		.marker:hover {
			background-color: blue; /* マウスオーバー時に青色 */
		}
		.camera-group {
			margin-bottom: 3px;
		}

		.camera-group h2 {
			font-size: 24px;
			margin-bottom: 3px;
			color: #333;
			text-align: left;
		}
		.camera-items {
			display: flex;
			flex-wrap: wrap;
			padding: 1px;
			justify-content: space-around;
			gap: 1px;
		}
		.camera-item {
			flex: 1 1 calc(25% - 3px); /* 幅を3等分 */
			width: 25%;
			padding: 1px;
			text-align: center;
		}
		.camera-image {
			width: 100%;
			height: auto;
			max-height: 500px; /* 必要に応じて調整 */
			object-fit: cover;
			display: block;
		}
		.camera-location {
			font-size: 14px;
			color: #666;
			margin-top: 2px;
		}
	</style>
</head>

</div>
<div class="camera-list" id="cameraList"></div>

<script>
	$(document).ready(function() {
		$('img[usemap]').rwdImageMaps();

		// カメラ一覧を生成
		const $cameraList = $('#cameraList');
		const groupedCameras = {};

		// area 要素をループしてグループ化
		$('area').each(function() {
			const area = $(this);
			const group = area.attr('group') || 'その他';
			const location = area.data('location');
			const href = area.attr('href');
			const alt = area.attr('alt');

			// グループごとに配列を初期化
			if (!groupedCameras[group]) {
				groupedCameras[group] = [];
			}

			// グループにカメラインフォメーションを追加
			groupedCameras[group].push({ href, alt, location });
		});

		// グループごとに表示
		Object.keys(groupedCameras).forEach(group => {
			const groupSection = `
				<div class="camera-group">
					<h2>${group}</h2>
					<div class="camera-items">
						${groupedCameras[group].map(camera => `
							<div class="camera-item">
								<img src="${camera.href}" alt="${camera.alt}" class="camera-image"/>
								<p class="camera-location">${camera.location || camera.alt}</p>
							</div>
						`).join('')}
					</div>
				</div>
			`;
			$cameraList.append(groupSection);
		});

		const $wrapper = $(".wrapper");

		// すべての<area>タグからマーカーを生成
		$("area").each(function (index) {
			const coords = $(this).attr("coords").split(",");
			const x = parseInt(coords[0], 10);
			const y = parseInt(coords[1], 10);

			// マーカーを生成
			const $marker = $("<div>")
				.addClass("marker")
				.css({ left: `${x}px`, top: `${y}px` })
				.attr("data-index", index);

			// マーカーをクリック時、リンク先に遷移
			$marker.on("click", () => {
				window.location.href = $(this).attr("href");
			});

			// マーカーをwrapper内に追加
			$wrapper.append($marker);
		});

		// マウスオーバーでプレビュー画像変更
		$("area").on("mouseover", function () {
			$("#p_area").attr("src", $(this).attr("href"));
		});

		$("area").on("mouseout", function () {
			$("#p_area").attr("src", "http://titiburomenkamera.saitama.jp/material/pic_area.jpg");
		});
	});
</script>
